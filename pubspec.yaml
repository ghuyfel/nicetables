name: nicetables
description: >-
  Feature-complete, theme-aware data tables for Flutter: typed columns,
  sorting, search, filters, pagination, selection, pinned columns,
  status chips and a responsive card layout.
version: 1.2.0
repository: https://github.com/ghuyfel/nicetables
issue_tracker: https://github.com/ghuyfel/nicetables/issues
topics:
  - table
  - datatable
  - grid
  - ui
  - widgets

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.19.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
